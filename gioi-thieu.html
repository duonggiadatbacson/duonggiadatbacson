    <style>
        /* =====================================================
           GIỚI THIỆU
        ===================================================== */

        .about-page {
            padding: 70px 20px 90px;
            background: #ffffff;
        }

        .about-container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .about-intro {
            text-align: center;
            margin-bottom: 60px;
        }

        .about-intro span {
            display: block;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 2px;
            color: #8a6a3d;
            margin-bottom: 12px;
        }

        .about-intro h1 {
            margin: 0;
            font-size: 38px;
            line-height: 1.3;
            color: #333333;
        }

        .about-intro p {
            max-width: 780px;
            margin: 20px auto 0;
            font-size: 17px;
            line-height: 1.8;
            color: #666666;
        }

        .about-story {
            margin-bottom: 75px;
        }

        .about-story:last-child {
            margin-bottom: 0;
        }

        .about-story-text {
            max-width: 900px;
            margin: 0 auto 35px;
        }

        .about-story-text p {
            margin: 0 0 18px;
            font-size: 17px;
            line-height: 1.9;
            color: #444444;
            text-align: justify;
        }

        .about-story-text p:last-child {
            margin-bottom: 0;
        }

        .about-story-image {
            width: 100%;
            overflow: hidden;
            border-radius: 12px;
        }

        .about-story-image img {
            display: block;
            width: 100%;
            height: 500px;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .about-story-image:hover img {
            transform: scale(1.02);
        }

        @media (max-width: 768px) {

            .about-page {
                padding: 45px 15px 60px;
            }

            .about-intro {
                margin-bottom: 40px;
            }

            .about-intro h1 {
                font-size: 30px;
            }

            .about-intro p {
                font-size: 16px;
            }

            .about-story {
                margin-bottom: 50px;
            }

            .about-story-text p {
                font-size: 16px;
                line-height: 1.8;
                text-align: left;
            }

            .about-story-image img {
                height: 300px;
            }
        }
    </style>
</head>

    <a href="contact.html" data-i18n="nav.contact">Liên Hệ</a>
</nav>
<div class="language-switcher">
    <button type="button" data-lang="vi">VI</button>
    <button type="button" data-lang="en">EN</button>
</div>

<a href="contact.html" class="booking-button" data-i18n="nav.booking">ĐẶT PHÒNG</a>

        </div>

    </div>

</header>


    <!-- NỘI DUNG GIỚI THIỆU -->

<main class="about-page">

    <div class="about-container">

        <div class="about-intro">

            <span>GIỚI THIỆU</span>

                Dương Gia Đạt Homestay
            </h1>

    src="images/video/GIOI-THIEU.mp4"

</video>

</main>

                Làng Quỳnh Sơn - Bắc Sơn - Lạng Sơn

        </div>
