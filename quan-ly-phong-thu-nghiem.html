<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản lý lịch phòng thử nghiệm</title><style>body{font:15px system-ui;background:#f7f9f7;color:#203027;max-width:1000px;margin:25px auto;padding:0 14px}section{background:white;border:1px solid #dce6df;border-radius:12px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}label{display:block;font-weight:600;font-size:14px}input,select{width:100%;padding:9px;border:1px solid #ccd7ce;border-radius:7px}button{background:#276749;color:white;border:0;padding:10px;border-radius:7px;cursor:pointer}table{width:100%;border-collapse:collapse;margin-top:14px}td,th{text-align:left;padding:9px;border-bottom:1px solid #ddd}.warn{color:#9a3d2e;font-size:13px}@media(max-width:650px){.grid{grid-template-columns:1fr 1fr}}</style><body><h1>Quản lý lịch đặt phòng</h1><p class="warn">BẢN THỬ NGHIỆM: dữ liệu chỉ lưu trong trình duyệt hiện tại, chưa có đăng nhập bảo mật và chưa đồng bộ với website/thiết bị khác. Không dùng để lưu dữ liệu khách thật.</p>
<section><h2>Thêm lượt đặt</h2><form id="f"><div class="grid"><div><label>Phòng</label><select id="room"><option value="r1">Phòng 01</option><option value="r2">Phòng 02</option><option value="r3">Phòng 03</option></select></div><div><label>Tên khách</label><input id="name" required></div><div><label>Số điện thoại</label><input id="phone"></div><div><label>Số khách</label><input id="guests" type="number" min="1" max="6" value="2"></div><div><label>Ngày nhận</label><input id="ci" type="date" required></div><div><label>Ngày trả</label><input id="co" type="date" required></div><div><label>Trạng thái</label><select id="status"><option value="confirmed">Đã xác nhận</option><option value="pending">Chờ xác nhận</option><option value="checkedin">Đã nhận phòng</option><option value="completed">Đã hoàn tất</option><option value="cancelled">Đã hủy</option></select></div><div><label>Ghi chú</label><input id="note"></div></div><p id="err" class="warn"></p><button>Lưu lượt đặt</button></form></section>
<section><h2>Lịch đặt phòng</h2><button id="clear">Xóa dữ liệu thử nghiệm</button><div style="overflow:auto"><table><thead><tr><th>Phòng</th><th>Khách</th><th>Ngày nhận</th><th>Ngày trả</th><th>Trạng thái</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section>
<script>const K="dgd_reservations_v1",names={r1:"Phòng 01",r2:"Phòng 02",r3:"Phòng 03"},$=x=>document.getElementById(x);function all(){try{return JSON.parse(localStorage.getItem(K)||"[]")}catch(e){return []}}function save(a){localStorage.setItem(K,JSON.stringify(a))}function esc(s){return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}function draw(){$("rows").innerHTML=all().map(x=>`<tr><td>${names[x.roomId]}</td><td>${esc(x.name)}<br>${esc(x.phone)}</td><td>${x.ci}</td><td>${x.co}</td><td>${x.status}</td><td><button onclick="del('${x.id}')">Xóa</button></td></tr>`).join("")||"<tr><td colspan='6'>Chưa có lượt đặt.</td></tr>"}window.del=id=>{if(confirm("Xóa lượt đặt này?")){save(all().filter(x=>x.id!==id));draw()}};$("f").onsubmit=e=>{e.preventDefault();let x={id:Date.now().toString(),roomId:$("room").value,name:$("name").value,phone:$("phone").value,guests:$("guests").value,ci:$("ci").value,co:$("co").value,status:$("status").value,note:$("note").value};if(!x.name||!x.ci||!x.co||x.co<=x.ci){$("err").textContent="Kiểm tra tên khách và ngày trả phải sau ngày nhận.";return}save([...all(),x]);$("f").reset();$("err").textContent="Đã lưu ở trình duyệt này.";draw()};$("clear").onclick=()=>{if(confirm("Xóa toàn bộ dữ liệu thử nghiệm?")){save([]);draw()}};draw();</script></body></html>
